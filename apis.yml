aid: mtnops
name: MTN OPS
description: >-
  MTN OPS is an American-owned outdoor performance nutrition and lifestyle brand
  founded in 2014 and headquartered in Fruit Heights, Utah. The company develops,
  manufactures, and sells energy and nutrition supplements (pre-workout, protein,
  hydration, creatine, and energy bars) alongside apparel and gear for hunters,
  tactical professionals, military, and outdoor athletes, running a "Conquer
  Hunger" program that donates one meal for every order placed. MTN OPS is a
  direct-to-consumer, internet-first retailer operating on the Shopify platform
  and is backed by Norwest Venture Partners. It publishes no bespoke developer
  API; the only machine-readable surfaces on its domain are the Shopify New
  Customer Accounts OIDC discovery documents and a Shopify-generated agent-commerce
  llms.txt. This profile was surfaced as a Norwest portfolio lead and enriched
  from the provider's live public surface.
